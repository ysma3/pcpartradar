apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-cron
spec:
  schedule: "*/1 * * * *"
  timeZone: "Europe/Paris"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: scraper
              image: ghcr.io/ysma3/pcpartradar-scraperservice:latest
              env:
                - name: POCKETBASE_URL
                  value: "http://pocketbase:8080"
                - name: POCKETBASE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: scraper-secret
                      key: POCKETBASE_TOKEN
          restartPolicy: Never
