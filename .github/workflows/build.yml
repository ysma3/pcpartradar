name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Docker Login
      # You may pin to the exact commit or the version.
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      # uses: docker/login-action@v4.6.0
      with:
        # Server address of Docker registry. If not set then will default to Docker Hub
        registry: ghcr.io
        # Username used to log against the Docker registry
        username: ${{ github.actor }}
        # Password or personal access token used to log against the Docker registry
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build productservice
      run: |
        docker build \
          ./productservice \
          --file ./productservice/Dockerfile \
          --tag ghcr.io/${{ github.repository_owner }}/pcpartradar-productservice:latest

    - name: Push productservice
      run: |
        docker push \
          ghcr.io/${{ github.repository_owner }}/pcpartradar-productservice:latest

    - name: Build scraperservice
      run: |
        docker build \
          ./scraperservice \
          --file ./scraperservice/Dockerfile \
          --tag ghcr.io/${{ github.repository_owner}}/pcpartradar-scraperservice:latest
    
    - name: Push scraperservice 
      run: |
        docker push \
          ghcr.io/${{ github.repository_owner}}/pcpartradar-scraperservice:latest

      
